name: Automated Public Mentions Crawler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-mentions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Live Public Mentions Scraper
        run: node scripts/crawl_mentions.mjs

      - name: Commit and push updated mentions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mentions.json
          git diff --staged --quiet || git commit -m "chore(crawler): auto-update live scraped mentions.json"
          git push
